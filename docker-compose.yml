services:
  mysql:
    image: mysql:8.0
    container_name: clinica-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD para o MySQL local}
      MYSQL_DATABASE: clinica_db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
